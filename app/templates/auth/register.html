<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — BiblioAi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a3c5e; --accent: #c8a45a; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a3c5e 0%, #2a6496 50%, #1a3c5e 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { font-family: 'Inter', sans-serif; color: var(--primary); font-size: 1.8rem; }
        .brand span { color: var(--accent); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(26,60,94,0.2); }
        .btn-register { background: var(--accent); color: #fff; border: none; padding: 0.7rem; font-size: 1rem; border-radius: 10px; }
        .btn-register:hover { background: #b08d3f; color: #fff; }
        label { font-weight: 600; font-size: 0.9rem; color: #444; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand"><i class="bi bi-person-plus me-2" style="color:var(--accent)"></i>Créer un compte</div>
        <p class="text-muted mt-1 small">Rejoignez la Bibliothèque Intelligente</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 text-center small">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/register">
        <div class="mb-3">
            <label for="username">Nom d'utilisateur</label>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="Min. 3 caractères" required autofocus minlength="3">
            </div>
        </div>
        <div class="mb-3">
            <label for="email">Adresse email</label>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="votre@email.com" required>
            </div>
        </div>
        <div class="mb-4">
            <label for="password">Mot de passe</label>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="Min. 6 caractères" required minlength="6">
            </div>
        </div>
        <button type="submit" class="btn btn-register w-100">
            <i class="bi bi-person-check me-2"></i>Créer mon compte
        </button>
    </form>

    <p class="text-center mt-4 mb-0 small text-muted">
        Déjà un compte ?
        <a href="/login" style="color: var(--primary); font-weight:700;">Se connecter</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
