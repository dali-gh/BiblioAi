<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — BiblioAi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a3c5e; --accent: #c8a45a; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a3c5e 0%, #2a6496 50%, #1a3c5e 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { font-family: 'Inter', sans-serif; color: var(--primary); font-size: 1.8rem; }
        .brand span { color: var(--accent); }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 0.2rem rgba(26,60,94,0.2); }
        .btn-login { background: var(--primary); color: #fff; border: none; padding: 0.7rem; font-size: 1rem; border-radius: 10px; }
        .btn-login:hover { background: #14304d; color: #fff; }
        .divider { color: #aaa; font-size: 0.9rem; }
        label { font-weight: 600; font-size: 0.9rem; color: #444; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand"><i class="bi bi-book-half me-2" style="color:var(--accent)"></i>Biblio<span>thèque</span></div>
        <p class="text-muted mt-1 small">BiblioAi avec Chatbot IA</p>
    </div>

    {% if request.query_params.get('registered') %}
    <div class="alert alert-success py-2 text-center small">
        <i class="bi bi-check-circle me-1"></i>Compte créé ! Connectez-vous maintenant.
    </div>
    {% endif %}

    {% if error %}
    <div class="alert alert-danger py-2 text-center small">
        <i class="bi bi-exclamation-triangle me-1"></i>{{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
        <div class="mb-3">
            <label for="username">Nom d'utilisateur</label>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" name="username" placeholder="Votre identifiant" required autofocus>
            </div>
        </div>
        <div class="mb-4">
            <label for="password">Mot de passe</label>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>
        <button type="submit" class="btn btn-login w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
        </button>
    </form>

    <p class="text-center mt-4 divider mb-0">
        Pas encore de compte ?
        <a href="/register" style="color: var(--primary); font-weight:700;">Créer un compte</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
